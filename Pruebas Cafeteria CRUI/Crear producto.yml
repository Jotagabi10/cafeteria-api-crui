info:
  name: Crear producto
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/productos
  body:
    type: json
    data: |-
      {
        "nombre": "Té",
        "precio": 1500,
        "categoria": "bebida"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
